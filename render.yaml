services:
  - type: web
    name: sawyer-tai-api
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y libgles2 libegl1 && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
